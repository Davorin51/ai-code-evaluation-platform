name: Quality and integration
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: ruff check . && ruff format --check .
      - run: pytest -m 'not docker' --cov --cov-fail-under=85 --cov-report=term-missing
      - run: python -m build
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-application-screenshots
          path: |
            docs/screenshots/*.png
            frontend/test-results
          if-no-files-found: ignore
  isolation-and-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: docker build -f worker/Dockerfile.sandbox -t ace-sandbox:local .
      - run: ACE_REQUIRE_DOCKER=1 pytest -m docker -v
      - run: cp .env.example .env && docker compose config --quiet
      - run: docker compose up -d --build
      - name: Verify actual API through nginx and separate trusted worker
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/api/health; then break; fi
            sleep 2
          done
          python scripts/compose_smoke.py
      - name: Verify opt-in Docker worker over the real API
        run: |
          export ACE_DOCKER_GID=$(stat -c '%g' /var/run/docker.sock)
          docker compose -f compose.yaml -f compose.sandbox.yaml up -d --build worker
          docker compose -f compose.yaml -f compose.sandbox.yaml exec -T worker id
          docker compose -f compose.yaml -f compose.sandbox.yaml exec -T worker docker version
          docker compose -f compose.yaml -f compose.sandbox.yaml exec -T worker docker image inspect ace-sandbox:local
          ACE_SMOKE_MODE=docker python scripts/compose_smoke.py
      - name: Container logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop disposable stack
        if: always()
        run: docker compose down -v
