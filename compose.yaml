services:
  api:
    build: .
    environment:
      ACE_DATABASE_URL: sqlite:////data/evaluations.db
      ACE_WORKER_URL: http://worker:8001
      ACE_WORKER_TOKEN: ${ACE_WORKER_TOKEN:?Copy .env.example to .env first}
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"]
    volumes: ["history:/data"]
    networks: [private]
    read_only: true
    tmpfs: ["/tmp:size=32m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      retries: 12
    depends_on: [worker]
  worker:
    build: .
    command: ["uvicorn", "worker.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      ACE_WORKER_TOKEN: ${ACE_WORKER_TOKEN:?Copy .env.example to .env first}
      ACE_EXECUTION_MODE: trusted
    networks: [private]
    read_only: true
    tmpfs: ["/tmp:size=32m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 128
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["127.0.0.1:8080:8080"]
    networks: [edge, private]
    depends_on:
      api:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 64
volumes:
  history:
networks:
  private:
    internal: true
  edge:
