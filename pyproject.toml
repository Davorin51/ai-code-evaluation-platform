[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "ai-code-evaluation-platform"
version = "0.1.0"
description = "Reproducible Python solution evaluation with a separate execution worker"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<2.1", "alembic>=1.14,<2", "pydantic-settings>=2.7,<3", "httpx>=0.28,<1", "reportlab>=4.2,<5", "ruff>=0.11,<1"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "hypothesis>=6,<7", "build>=1,<2"]
[tool.setuptools.packages.find]
include = ["backend*", "worker*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: requires a working Docker daemon and built sandbox image"]
[tool.ruff]
line-length = 100
exclude = [".venv", "frontend", "backend/migrations"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
[tool.coverage.run]
source = ["backend/app", "worker"]
omit = ["worker/runner.py"]
[tool.coverage.report]
show_missing = true
